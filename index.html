<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efcf">
  <title>森林裡的生日秘密 · A Little Forest Wish</title>
  <link rel="preload" href="assets/forest-cinematic.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cinematic.css?v=2">
  <script src="geometry.js" defer></script>
  <script src="script.js?v=2" defer></script>
  <script src="enhanced-levels.js?v=2" defer></script>
</head>
<body data-time="0" class="cinematic-forest">
  <div class="world" aria-hidden="true"><div class="sky"></div><div class="sun-glow"></div><div class="night-sky"></div><svg id="forest" viewBox="0 0 1440 940" preserveAspectRatio="xMidYMax slice"></svg><div class="paper-grain"></div></div>
  <header class="site-header interface">
    <a class="wordmark" href="./index.html" aria-label="森林裡的生日秘密首頁"><span class="brand-leaf">❧</span> THE WISHING WOODS<span class="brand-caption">一份藏在森林裡的生日禮物</span></a>
    <div class="header-right"><span id="time-label">白晝 · 森林甦醒</span><div class="progress" aria-label="拼圖收集進度"><span id="progress-icons" aria-hidden="true">◇ ◇ ◇ ◇</span><b id="progress-count">0 / 4</b></div></div>
  </header>
  <main>
    <section class="introduction interface"><div class="eyebrow"><span></span> A LITTLE FOREST WISH <span></span></div><h1>森林裡的<span>生日秘密</span></h1><p>森林裡藏著四塊拼圖。<br>找到它們，就能打開最後的秘密。</p></section>
    <section class="clearing" aria-label="神秘木門拼圖">
      <div class="frame-wrap"><span class="frame-leaves" aria-hidden="true">❧</span><div class="wood-frame" id="wood-frame"><button class="door" id="door" aria-label="神秘木門，收集四塊拼圖後開啟" disabled><div id="puzzle" class="puzzle"><div class="piece" data-piece="0"><span>✧</span></div><div class="piece" data-piece="1"><span>✧</span></div><div class="piece" data-piece="2"><span>✧</span></div><div class="piece" data-piece="3"><span>✧</span></div></div><video id="birthday-video" playsinline preload="none" src="assets/birthday-web.mp4" poster="assets/door-frame-enhanced.webp"></video><canvas id="last-frame" aria-hidden="true"></canvas><span class="door-action">輕觸木門，讓故事開始 ✧</span></button></div><div class="frame-foot"></div><p id="frame-message" class="frame-message interface" aria-live="polite">每一塊拼圖，都藏著一點小小的魔法。</p></div>
      <div class="forest-friend interface" id="bear"></div><span class="friend-note interface">維尼陪你，一起慢慢找。</span>
    </section>
    <nav class="trail interface" aria-label="四個森林關卡"><div class="trail-caption"><span class="dotted-line"></span> 沿著小徑，尋找四份魔法 <span class="dotted-line"></span></div><div class="level-list">
      <button class="level-entry sign" data-level="0"><span class="entry-art" id="art-0"></span><span class="level-meta">01 / 白天</span><strong>森林尋物</strong><span class="level-sub">小小的秘密，躲在哪裡？</span><span class="entry-status">開始探索 <i>↗</i></span></button>
      <button class="level-entry leaf" data-level="1" disabled><span class="entry-art" id="art-1"></span><span class="level-meta">02 / 午後</span><strong>換個角度</strong><span class="level-sub">讓散落的風景，重新相遇。</span><span class="entry-status">等待第一塊拼圖</span></button>
      <button class="level-entry stone" data-level="2" disabled><span class="entry-art" id="art-2"></span><span class="level-meta">03 / 黃昏</span><strong>追著光走</strong><span class="level-sub">夕陽會告訴你答案。</span><span class="entry-status">等待第二塊拼圖</span></button>
      <button class="level-entry night" data-level="3" disabled><span class="entry-art" id="art-3"></span><span class="level-meta">04 / 星空</span><strong>天秤的星語</strong><span class="level-sub">把心願，連成一片星空。</span><span class="entry-status">等待第三塊拼圖</span></button>
    </div></nav>
  </main>
  <footer class="interface"><span>為你留一點童話，也留一點溫柔。 <span class="tiny-star">✧</span></span><div><button id="choose-video">更換生日影片</button><button id="reset">重新探索</button></div></footer>
  <input type="file" id="video-file" accept="video/*" hidden>
  <div id="media-notice" class="media-notice" hidden role="status"></div>
  <dialog id="level-dialog" aria-labelledby="level-title"><div class="dialog-top"><span id="level-eyebrow"></span><button id="close-level" aria-label="回到森林">回到森林 ↗</button></div><h2 id="level-title"></h2><p id="level-instruction"></p><div id="level-scene"></div><p id="level-feedback" aria-live="polite"></p></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
